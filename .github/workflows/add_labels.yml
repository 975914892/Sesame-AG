name: Issue Intake

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]

concurrency:
  group: issue-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  triage-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Classify issue and validate required information
        uses: actions/github-script@v7
        with:
          script: |
            const eventIssue = context.payload.issue;
            if (!eventIssue || eventIssue.pull_request) {
              core.info('Skipping pull request or unsupported payload.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = eventIssue.number;
            if (
              context.eventName === 'issues' &&
              ['labeled', 'unlabeled'].includes(context.payload.action) &&
              !['bug', 'enhancement'].includes(context.payload.label?.name?.toLowerCase())
            ) {
              core.info('Skipping unrelated label event.');
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber
            });
            const issueBody = issue.body || '';
            const author = issue.user?.login || 'there';
            const isIssueCommentEvent = context.eventName === 'issue_comment';
            const commentAuthor = context.payload.comment?.user?.login || '';
            const openedNow =
              context.eventName === 'issues' && context.payload.action === 'opened';

            if (issue.state !== 'open' || issue.pull_request) {
              core.info('Skipping closed issue event.');
              return;
            }

            if (isIssueCommentEvent) {
              if (context.payload.comment?.user?.type === 'Bot') {
                core.info('Skipping bot comment.');
                return;
              }
              if (commentAuthor !== author) {
                core.info('Skipping comment from non-author.');
                return;
              }
            }

            const labels = (issue.labels || []).map((label) => label.name);
            const lowerLabels = new Set(labels.map((label) => label.toLowerCase()));
            const isBug = lowerLabels.has('bug');
            const isFeature = lowerLabels.has('enhancement');
            if (isBug === isFeature) {
              core.info('Skipping issue without exactly one supported Issue Form label.');
              return;
            }

            const labelConfig = {
              'need info': {
                color: 'd73a4a',
                description: 'Needs more information from the issue author'
              },
              '模块本体': {
                color: '1d76db',
                description: 'Issue is about the Sesame-AG module itself'
              },
              '目标应用': {
                color: '5319e7',
                description: 'Issue is about a target application'
              }
            };
            const scopeLabels = ['模块本体', '目标应用'];
            const botLogin = 'github-actions[bot]';
            const statusMarker = '<!-- sesame-ag:issue-intake -->';
            const logHeadings = [
              ['错误日志附件', '错误日志附件（必填）'],
              ['完整日志及相关模块日志附件', '全部日志 / 对应模块日志附件（必填）']
            ];

            function escapeRegExp(value) {
              return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            function extractSection(markdown, heading) {
              const pattern = new RegExp(
                `(?:^|\\n)###[\\t ]+${escapeRegExp(heading)}[\\t ]*(?=\\r?\\n|$)([\\s\\S]*?)(?=\\r?\\n###[\\t ]+|$)`,
                'i'
              );
              const value = markdown.match(pattern)?.[1]?.trim() || '';
              return value === '_No response_' ? '' : value;
            }

            function extractFirstSection(markdown, headings) {
              for (const heading of headings) {
                const value = extractSection(markdown, heading);
                if (value) {
                  return value;
                }
              }
              return '';
            }

            function parseScope(markdown) {
              const scope = extractSection(markdown, '反馈对象');
              return scopeLabels.includes(scope) ? scope : '';
            }

            function attachmentLinks(markdown) {
              const urls = markdown.match(/https?:\/\/[^\s<>)\]"']+/gi) || [];
              return urls
                .map((url) => url.replace(/[.,;:!?]+$/, ''))
                .filter((url) => {
                  try {
                    const parsed = new URL(url);
                    return parsed.protocol === 'https:' &&
                      parsed.host === 'github.com' &&
                      !parsed.username && !parsed.password &&
                      (
                        /^\/user-attachments\/files\/\d+\/[^/]+$/i.test(parsed.pathname) ||
                        /^\/[^/]+\/[^/]+\/files\/\d+\/[^/]+$/i.test(parsed.pathname)
                      ) &&
                      /\.(?:txt|log|zip|gz|json)$/i.test(parsed.pathname);
                  } catch {
                    return false;
                  }
                });
            }

            function hasMeaningfulTargetAppInfo(value) {
              const compact = value.replace(/\s+/g, '').toLowerCase();
              if (!compact) {
                return false;
              }
              return !/^(?:不涉及|不适用|无|none|n\/?a)(?:[，,。.;；:].*)?$/.test(compact);
            }

            if (isIssueCommentEvent) {
              const changedBodies = [
                context.payload.comment?.body || '',
                context.payload.changes?.body?.from || ''
              ];
              if (
                !isBug ||
                !changedBodies.some((body) => logHeadings.some(
                  (headings) => extractFirstSection(body, headings)
                ))
              ) {
                core.info('Skipping comment without log sections.');
                return;
              }
            }

            const events = await github.paginate(github.rest.issues.listEvents, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100
            });
            const latestLabelEvents = new Map();
            for (const event of events) {
              if (
                !['labeled', 'unlabeled'].includes(event.event) ||
                !Object.hasOwn(labelConfig, event.label?.name)
              ) {
                continue;
              }
              const previous = latestLabelEvents.get(event.label.name);
              if (!previous || event.id > previous.id) {
                latestLabelEvents.set(event.label.name, event);
              }
            }

            const hasNeedInfo = labels.includes('need info');
            const needInfoEvent = latestLabelEvents.get('need info');
            const preserveNeedInfo = needInfoEvent
              ? needInfoEvent.actor?.type !== 'Bot' ||
                needInfoEvent.actor?.login !== botLogin ||
                needInfoEvent.event !== (hasNeedInfo ? 'labeled' : 'unlabeled')
              : hasNeedInfo;
            const comments = preserveNeedInfo ? [] : await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: issueNumber, per_page: 100 }
            );

            async function ensureLabel(name) {
              const config = labelConfig[name];
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color: config.color,
                  description: config.description
                });
              }
            }

            async function addLabel(name) {
              if (labels.includes(name)) {
                return;
              }
              const lastEvent = latestLabelEvents.get(name);
              if (lastEvent && (
                lastEvent.actor?.type !== 'Bot' || lastEvent.actor?.login !== botLogin
              )) {
                return;
              }
              await ensureLabel(name);
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: [name]
              });
            }

            async function removeLabel(name) {
              if (!labels.includes(name)) {
                return;
              }
              const lastEvent = latestLabelEvents.get(name);
              if (
                lastEvent?.event !== 'labeled' ||
                lastEvent.actor?.type !== 'Bot' || lastEvent.actor?.login !== botLogin
              ) {
                return;
              }
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: issueNumber,
                name
              });
            }

            const scope = parseScope(issueBody);
            if (scope) {
              await addLabel(scope);
            }
            for (const label of scopeLabels) {
              if (label !== scope) {
                await removeLabel(label);
              }
            }

            if (preserveNeedInfo) {
              core.info('Preserving manually managed or unattributed need info state.');
              return;
            }

            const missing = [];
            if (!scope) {
              missing.push('反馈对象（请选择“模块本体”或“目标应用”）');
            }

            const requiredSections = isBug ? [
              '提交前检查', '问题摘要', '复现步骤', '预期行为', '实际行为',
              '模块版本 / 提交', 'Android 版本 / 手机系统版本',
              'LSPosed 版本与 libxposed API',
              '目标应用信息 / 受影响模块功能', '安装来源 / 构建方式'
            ] : [
              '提交前检查', '目标应用信息 / 模块功能上下文', '建议摘要',
              '你要解决的问题', '期望的解决方案', '影响与价值'
            ];
            for (const heading of requiredSections) {
              if (!extractSection(issueBody, heading)) {
                missing.push(heading);
              }
            }

            const dropdownOptions = isBug ? {
              '问题类型': ['回归问题', '崩溃 / 卡死', '行为异常', 'UI / 文档问题'],
              'Root / Shizuku 情况': ['未使用', '使用 Root', '使用 Shizuku', '两者都使用', '不确定']
            } : {
              '增强类型': ['功能型增强', '优化型增强', '工程 / 工具链改进', '文档改进', '强迫症增强'],
              '主要影响范围': ['任务逻辑', 'Hook / RPC', 'UI / 设置页', '调试工具 / 日志', '构建 / 发布 / 元数据', '文档 / 协作流程', '其他']
            };
            for (const [heading, options] of Object.entries(dropdownOptions)) {
              if (!options.includes(extractSection(issueBody, heading))) {
                missing.push(`${heading}（请手动选择有效选项）`);
              }
            }

            if (isBug) {
              const logBodies = [issueBody, ...comments.filter(
                (comment) => comment.user?.login === author && comment.user?.type !== 'Bot'
              ).map((comment) => comment.body || '')];
              for (const headings of logHeadings) {
                if (!logBodies.some(
                  (body) => attachmentLinks(extractFirstSection(body, headings)).length > 0
                )) {
                  missing.push(headings[0]);
                }
              }
            }

            const targetAppInfo = extractSection(issueBody, isBug
              ? '目标应用信息 / 受影响模块功能'
              : '目标应用信息 / 模块功能上下文');
            if (
              scope === '目标应用' && targetAppInfo &&
              !hasMeaningfulTargetAppInfo(targetAppInfo)
            ) {
              missing.push('目标应用信息（请填写目标应用版本，不能填写“不涉及”）');
            }

            const kind = isBug ? 'Bug' : '功能建议';

            function receivedMessage() {
              const details = isBug
                ? '已检测到指定栏目和附件链接，内容仍需维护者确认。'
                : '已检测到必填栏目，建议内容和是否受理仍需维护者确认。';
              return `您好 @${author}，已收到${scope ? `「${scope}${kind}」` : kind}。${details}`;
            }

            function missingMessage() {
              const details = missing.map((item) => `- **${item}**`).join('\n');
              const logGuide = isBug
                ? '\n\n请在日志中心导出错误日志、全部日志和相关模块日志，脱敏后从 `/Download/sesame-AG/` 上传到原 Issue 的对应栏目，截图和无栏目附件不能代替日志。无法获取日志时，请在原栏目说明原因。'
                : '';
              return `您好 @${author}，感谢提交${scope ? `「${scope}${kind}」` : kind}。当前仍缺少以下必要信息：\n${details}${logGuide}\n\n其他信息请编辑原 Issue 补充，随后会自动重新检查。由自动检查管理的 Issue 连续 3 天无更新且仍缺必要信息时将被自动关闭。`;
            }

            if (missing.length > 0) {
              await addLabel('need info');
            } else if (hasNeedInfo) {
              await removeLabel('need info');
            }

            const statusComment = comments.filter((comment) =>
              comment.user?.type === 'Bot' && comment.user?.login === botLogin &&
              (comment.body || '').startsWith(`${statusMarker}\n`)
            ).sort((left, right) => right.id - left.id)[0];
            const body = `${statusMarker}\n${missing.length > 0 ? missingMessage() : receivedMessage()}`;
            if (statusComment) {
              if (statusComment.body !== body) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: statusComment.id,
                  body
                });
              }
            } else if (missing.length > 0 || hasNeedInfo || openedNow) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body
              });
            }
