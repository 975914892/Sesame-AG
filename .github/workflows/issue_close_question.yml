name: Issue Close Question

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  issue-close-require:
    runs-on: ubuntu-latest
    steps:
      - name: Close stale need info issues
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const labelName = 'need info';
            const botLogin = 'github-actions[bot]';
            const inactiveMs = 3 * 24 * 60 * 60 * 1000;
            const now = Date.now();

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: labelName,
              per_page: 100
            });

            let closedCount = 0;
            for (const issue of issues) {
              if (issue.pull_request) {
                continue;
              }

              const inactiveForMs = now - new Date(issue.updated_at).getTime();
              if (!Number.isFinite(inactiveForMs) || inactiveForMs < inactiveMs) {
                continue;
              }

              try {
                const events = await github.paginate(github.rest.issues.listEvents, {
                  owner,
                  repo,
                  issue_number: issue.number,
                  per_page: 100
                });
                const needInfoEvent = events.filter((event) =>
                  ['labeled', 'unlabeled'].includes(event.event) && event.label?.name === labelName
                ).sort((left, right) => right.id - left.id)[0];
                if (
                  needInfoEvent?.event !== 'labeled' ||
                  needInfoEvent.actor?.type !== 'Bot' || needInfoEvent.actor?.login !== botLogin
                ) {
                  core.info(`Skipping manually managed or unattributed issue #${issue.number}.`);
                  continue;
                }

                const { data: currentIssue } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: issue.number
                });
                const updatedAt = new Date(currentIssue.updated_at).getTime();
                if (
                  currentIssue.state !== 'open' || currentIssue.pull_request ||
                  !(currentIssue.labels || []).some((label) => label.name === labelName) ||
                  !Number.isFinite(updatedAt) || Date.now() - updatedAt < inactiveMs
                ) {
                  continue;
                }

                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'not_planned'
                });
                closedCount += 1;

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: '由于该 Issue 连续 3 天无更新且仍缺必要信息，现已被自动关闭。若仍需处理，请补充所需信息后重新打开。'
                });
              } catch (error) {
                core.warning(`Stopped processing issue #${issue.number}: ${error.message}`);
              }
            }

            core.info(`Closed ${closedCount} stale need info issue(s).`);
